name: desktop

on:
  push:
    paths:
      - 'desktop/**'
      - 'api/**'
      - 'app/icons/icon.ico'
      - 'fixtures/layout/**'
      - 'skills/**'
      - 'src/**'
      - 'web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/config.toml'
      - '.nvmrc'
      - 'rust-toolchain.toml'
      - 'scripts/version.sh'
      - 'scripts/worktree/setup.sh'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LOOM_RELEASES: https://github.com/BrownC98/loom-chat/releases

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 화면 빌드
        run: bash scripts/worktree/setup.sh
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Linux loom 빌드
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          LOOM_VERSION="$(sh scripts/version.sh)" cargo build --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/loom "$RUNNER_TEMP/loom-linux"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: loom-linux
          path: ${{ runner.temp }}/loom-linux
          if-no-files-found: error

  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: loom-desktop-windows-x64
            file: loom-desktop.exe
          - os: macos-15
            artifact: loom-desktop-macos-arm64
            file: loom-desktop
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 화면 빌드
        run: bash scripts/worktree/setup.sh
        working-directory: .
        env:
          npm_config_script_shell: bash
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop
          shared-key: native-desktop
      - name: 배치 고정값 시험
        if: runner.os == 'Windows'
        run: cargo test
      - name: 빌드
        run: LOOM_VERSION="$(sh ../scripts/version.sh)" cargo build --release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: desktop/target/release/${{ matrix.file }}
          if-no-files-found: error
